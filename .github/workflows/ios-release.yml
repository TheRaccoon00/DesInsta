name: iOS Release Build

on:
  push:
    branches: [ release ]

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create .env file
        run: |
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> .env
          echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> .env
      - name: Install certificate
        run: |
          printf "%s" "${{ secrets.IOS_CERTIFICATE }}" | base64 -D > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "${{ secrets.CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-keychain-settings -lut 21600 build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 -D > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Install dependencies & generate iOS project
        run: |
          npm install
          npx expo prebuild -p ios

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Install Fastlane
        run: sudo gem install fastlane

      - name: Build IPA
        run: |
          # Extract Team ID and Provisioning Profile UUID
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision > profile.plist || true
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" profile.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" profile.plist)
          
          cd ios
          WORKSPACE=$(ls -1td *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          
          fastlane gym \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME" \
            --clean \
            --export_method app-store \
            --output_directory build/ipa \
            --xcargs "DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution'"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cd ios
          fastlane beta

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/ipa/*.ipa